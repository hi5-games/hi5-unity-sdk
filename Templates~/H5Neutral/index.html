<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <!-- H5:HEAD -->
    <style>
      html, body { width: 100%; height: 100%; margin: 0; padding: 0; background: #000; overflow: hidden; }
      #unity-container { position: fixed; inset: 0; }
      #unity-canvas { width: 100%; height: 100%; display: block; background: {{{ BACKGROUND_COLOR }}}; }
      #h5-loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #111; color: #fff; font-family: sans-serif; }
      #h5-icon { width: 128px; height: 128px; object-fit: contain; border-radius: 22px; }
      #h5-loading-bar { width: 60%; max-width: 320px; height: 8px; background: #333; border-radius: 4px; overflow: hidden; margin-top: 16px; }
      #h5-icon + #h5-loading-bar { margin-top: 24px; }
      #h5-loading-fill { width: 0%; height: 100%; background: #8f48ff; }
    </style>
  </head>
  <body>
    <!-- H5:BODY_START -->
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="h5-loading">
        <!-- Default icon from Project Settings (copied by the neutral build to TemplateData/h5-icon.png); removed when absent. -->
        <img id="h5-icon" src="TemplateData/h5-icon.png" alt="" onerror="this.remove()">
        <div id="h5-loading-bar"><div id="h5-loading-fill"></div></div>
      </div>
    </div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      // Neutral template: no portal-specific code. The H5 Packager injects platform
      // scripts/config at the H5:* marker comments and may replace this loader block.
      window.__H5_CONFIG__ = window.__H5_CONFIG__ || {};
      var h5Config = {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}}
      };
      // H5.boot() (h5-bridge.js, injected by the Packager) initialises the target portal's SDK
      // first; on a raw neutral build window.H5 is absent and Unity just starts.
      var h5Boot = (window.H5 && window.H5.boot) ? window.H5.boot() : Promise.resolve();
      h5Boot.then(function () {
        return createUnityInstance(document.querySelector("#unity-canvas"), h5Config, function (p) {
          document.getElementById("h5-loading-fill").style.width = (p * 100) + "%";
          if (window.H5 && window.H5.progress) window.H5.progress(p);
        });
      }).then(function (instance) {
        window.unityInstance = instance;
        document.getElementById("h5-loading").style.display = "none";
      }).catch(function (message) { console.error(message); });
    </script>
    <!-- H5:BODY_END -->
  </body>
</html>
